name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar proyecto
        run: mvn clean package -DskipTests

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Mover JAR junto al Dockerfile
        run: cp target/hola-mundo-api-1.0.0.jar hola-mundo-api-1.0.0.jar

      - name: Construir imagen Docker
        run: docker build -t hola-mundo-api:latest .

      - name: Copiar artefactos al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "hola-mundo-api-1.0.0.jar,Dockerfile"
          target: "/home/app/hola-mundo-api"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Desplegar contenedor en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/app/hola-mundo-api
            docker build -t hola-mundo-api:latest .
            docker stop hola-mundo-api || true
            docker rm hola-mundo-api || true
            docker run -d \
              --name hola-mundo-api \
              --restart unless-stopped \
              -p 8081:8080 \
              hola-mundo-api:latest
            docker image prune -f
